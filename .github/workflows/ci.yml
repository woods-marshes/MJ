name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK & run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mj-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing keystore (optional)
        env:
          MJ_KEYSTORE_BASE64: ${{ secrets.MJ_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MJ_KEYSTORE_BASE64" ]; then
            echo "$MJ_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mj-release.jks"
            echo "MJ_STORE_FILE=$RUNNER_TEMP/mj-release.jks" >> "$GITHUB_ENV"
            echo "MJ_STORE_PASSWORD=${{ secrets.MJ_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "MJ_KEY_ALIAS=${{ secrets.MJ_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "MJ_KEY_PASSWORD=${{ secrets.MJ_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Keystore configured from secrets"
          else
            echo "No signing secret configured, falling back to debug signing"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
